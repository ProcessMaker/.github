name: Download JS stack artifact
description: Download the js-stack artifact from another workflow run via gh

inputs:
  source-repo:
    description: owner/repo that uploaded the artifact
    required: true
  source-run-id:
    description: Workflow run id that uploaded js-stack
    required: true
  dest:
    description: Directory to extract into
    required: false
    default: js-stack

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SOURCE_REPO: ${{ inputs.source-repo }}
        SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        DEST: ${{ inputs.dest }}
      run: |
        set -euo pipefail
        if [ -z "$SOURCE_REPO" ] || [ -z "$SOURCE_RUN_ID" ]; then
          echo "No source stack to download"
          mkdir -p "$DEST"
          exit 0
        fi
        mkdir -p "$DEST"
        gh run download "$SOURCE_RUN_ID" \
          --repo "$SOURCE_REPO" \
          --name js-stack \
          --dir "$DEST"
        ls -la "$DEST"
