name: Pack JS package
description: Install (with optional file tarball pins), build, npm pack, merge into stack.json

inputs:
  stack-dir:
    description: Directory with existing stack.json and tarballs (may be empty)
    required: false
    default: js-stack
  node-version:
    description: Node.js version
    required: false
    default: '20'
  origin-repo:
    description: Origin GitHub repo (owner/name)
    required: false
    default: ''
  origin-pr:
    description: Origin PR number
    required: false
    default: ''
  origin-sha:
    description: Origin git sha
    required: false
    default: ''
  stack-id:
    description: Stack id
    required: true

outputs:
  tarball:
    description: Packed tarball filename
    value: ${{ steps.pack.outputs.tarball }}
  package-name:
    description: npm package name
    value: ${{ steps.pack.outputs.package-name }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - id: pack
      shell: bash
      env:
        STACK_DIR: ${{ inputs.stack-dir }}
        STACK_ID: ${{ inputs.stack-id }}
        ORIGIN_REPO: ${{ inputs.origin-repo }}
        ORIGIN_PR: ${{ inputs.origin-pr }}
        ORIGIN_SHA: ${{ inputs.origin-sha }}
      run: |
        set -euo pipefail
        mkdir -p deps "$STACK_DIR"

        if [ -f "$STACK_DIR/stack.json" ]; then
          cp "$STACK_DIR/stack.json" stack.json
          find "$STACK_DIR" -maxdepth 1 -name '*.tgz' -exec cp {} deps/ \;
          find "$STACK_DIR" -maxdepth 1 -name '*.tgz' -exec cp {} . \;
        else
          echo '{"stack_id":"'"$STACK_ID"'","origin":{},"packages":{}}' > stack.json
        fi

        command=$(jq -r '.processmaker.build.command // empty' package.json)
        pkg_name=$(jq -r '.name' package.json)
        sha=$(git rev-parse --short HEAD)

        if [ -f stack.json ] && [ "$(jq -r '.packages | length' stack.json)" != "0" ]; then
          while IFS= read -r npm_name; do
            tarball=$(jq -r --arg p "$npm_name" '.packages[$p].tarball' stack.json)
            if [ -z "$tarball" ] || [ "$tarball" = "null" ]; then
              continue
            fi
            if [ ! -f "deps/$tarball" ]; then
              echo "::error::Missing tarball deps/$tarball for $npm_name"
              exit 1
            fi
            for section in dependencies devDependencies optionalDependencies; do
              if jq -e --arg p "$npm_name" --arg s "$section" '.[$s][$p] != null' package.json >/dev/null; then
                echo "Pinning $npm_name ($section) to file:./deps/$tarball"
                npm pkg set "${section}.${npm_name}=file:./deps/${tarball}"
              fi
            done
          done < <(jq -r '.packages | keys[]' stack.json)
          npm install
        else
          npm ci
        fi

        if [ -n "$command" ]; then
          npm run "$command"
        fi

        tarball=$(npm pack --json | jq -r '.[0].filename // empty')
        if [ -z "$tarball" ]; then
          tarball=$(npm pack | tail -n 1)
        fi
        if [ -z "$tarball" ] || [ ! -f "$tarball" ]; then
          echo "::error::npm pack did not produce a tarball"
          exit 1
        fi
        echo "Packed $tarball"

        origin_repo="${ORIGIN_REPO:-}"
        origin_pr="${ORIGIN_PR:-}"
        origin_sha="${ORIGIN_SHA:-$sha}"
        jq \
          --arg id "$STACK_ID" \
          --arg repo "$origin_repo" \
          --arg pr "$origin_pr" \
          --arg osha "$origin_sha" \
          --arg name "$pkg_name" \
          --arg tarball "$tarball" \
          --arg sha "$sha" \
          '.stack_id = $id
           | .origin.repo = (if $repo == "" then .origin.repo else $repo end)
           | .origin.pr = (if $pr == "" then .origin.pr else ($pr | tonumber? // $pr) end)
           | .origin.sha = (if $osha == "" then .origin.sha else $osha end)
           | .packages[$name] = {tarball: $tarball, sha: $sha, rebuilt: true}' \
          stack.json > stack.json.tmp
        mv stack.json.tmp stack.json

        cp "$tarball" "$STACK_DIR/"
        cp stack.json "$STACK_DIR/"
        find deps -maxdepth 1 -name '*.tgz' -exec cp {} "$STACK_DIR/" \; 2>/dev/null || true
        cp "$tarball" "$STACK_DIR/" 2>/dev/null || true

        echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
        echo "package-name=$pkg_name" >> "$GITHUB_OUTPUT"
        cat stack.json
