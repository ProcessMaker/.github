name: Resolve JS stack plan
description: Parse ci:repo:branch tags and compute which JS packages to rebuild

inputs:
  pr-body:
    description: Pull request body
    required: false
    default: ''
  trigger-repo:
    description: GitHub repo name of the originating PR
    required: true
  trigger-head-ref:
    description: PR head branch or SHA
    required: false
    default: ''
  base-branch:
    description: PR base branch
    required: false
    default: develop

outputs:
  has_js_stack:
    description: true if any JS rebuild is needed
    value: ${{ steps.resolve.outputs.has_js_stack }}
  entry_repo:
    description: Leftmost JS repo to start building
    value: ${{ steps.resolve.outputs.entry_repo }}
  cascade_repos:
    description: JSON array of repos in topological rebuild order
    value: ${{ steps.resolve.outputs.cascade_repos }}
  branch_map:
    description: JSON object of repo to branch
    value: ${{ steps.resolve.outputs.branch_map }}
  stop_before:
    description: Repo to halt upstream bootstrap cascade before
    value: ${{ steps.resolve.outputs.stop_before }}
  trigger_repo:
    description: Originating PR repo name
    value: ${{ steps.resolve.outputs.trigger_repo }}
  trigger_head_ref:
    description: Originating PR head ref
    value: ${{ steps.resolve.outputs.trigger_head_ref }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        PR_BODY: ${{ inputs.pr-body }}
        TRIGGER_REPO: ${{ inputs.trigger-repo }}
        TRIGGER_HEAD_REF: ${{ inputs.trigger-head-ref }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        GRAPH_FILE: ${{ github.action_path }}/../../js-stack-graph.json
        PARSE_CI_TAGS: ${{ github.action_path }}/../../scripts/parse-ci-tags.sh
      run: bash "${{ github.action_path }}/../../scripts/resolve-js-stack.sh"
