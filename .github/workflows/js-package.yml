name: js-package
run-name: js-stack ${{ inputs.stack_id || github.event.pull_request.number || github.run_id }}

on:
  workflow_call:
    inputs:
      stack_id:
        type: string
        required: false
        default: ''
      source_repo:
        type: string
        required: false
        default: ''
      source_run_id:
        type: string
        required: false
        default: ''
      origin_branch:
        type: string
        required: false
        default: ''
      branch_map:
        description: JSON object of repo name to git ref
        type: string
        required: false
        default: ''
      cascade_stop_before:
        description: Halt downstream cascade before this repo (upstream bootstrap)
        type: string
        required: false
        default: ''
      trigger_repo:
        description: Originating PR repo name
        type: string
        required: false
        default: ''
      trigger_head_ref:
        description: Originating PR head branch or SHA
        type: string
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  pull-requests: write
  actions: write
  packages: write

env:
  GH_TOKEN: ${{ secrets.GIT_TOKEN }}

jobs:
  resolve-stack:
    name: Resolve JS stack plan
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      stack-id: ${{ steps.ids.outputs.stack-id }}
      has_js_stack: ${{ steps.resolve.outputs.has_js_stack }}
      entry_repo: ${{ steps.resolve.outputs.entry_repo }}
      cascade_repos: ${{ steps.resolve.outputs.cascade_repos }}
      branch_map: ${{ steps.resolve.outputs.branch_map }}
      stop_before: ${{ steps.resolve.outputs.stop_before }}
      trigger_repo: ${{ steps.resolve.outputs.trigger_repo }}
      trigger_head_ref: ${{ steps.resolve.outputs.trigger_head_ref }}
    steps:
      - name: Resolve stack id
        id: ids
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.stack_id }}" ]; then
            sid="${{ inputs.stack_id }}"
          else
            sid="${{ github.event.repository.name }}-pr-${{ github.event.pull_request.number }}"
          fi
          echo "stack-id=$sid" >> "$GITHUB_OUTPUT"
          echo "Stack id: $sid"

      - uses: ProcessMaker/.github/.github/actions/js-resolve-stack@main
        id: resolve
        with:
          pr-body: ${{ github.event.pull_request.body }}
          trigger-repo: ${{ github.event.repository.name }}
          trigger-head-ref: ${{ github.event.pull_request.head.ref }}
          base-branch: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}

  upstream-bootstrap:
    name: Bootstrap upstream JS packages
    needs: resolve-stack
    if: |
      needs.resolve-stack.outputs.has_js_stack == 'true' &&
      needs.resolve-stack.outputs.entry_repo != '' &&
      needs.resolve-stack.outputs.entry_repo != github.event.repository.name
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.dispatch.outputs.run_id }}
      repo: ${{ steps.dispatch.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ProcessMaker/.github
          path: _pm_github

      - id: dispatch
        env:
          STACK_ID: ${{ needs.resolve-stack.outputs.stack-id }}
          ENTRY_REPO: ${{ needs.resolve-stack.outputs.entry_repo }}
          BRANCH_MAP: ${{ needs.resolve-stack.outputs.branch_map }}
          STOP_BEFORE: ${{ needs.resolve-stack.outputs.stop_before }}
          CASCADE_STOP_BEFORE: ${{ needs.resolve-stack.outputs.stop_before }}
          TRIGGER_REPO: ${{ needs.resolve-stack.outputs.trigger_repo }}
          TRIGGER_HEAD_REF: ${{ needs.resolve-stack.outputs.trigger_head_ref }}
          WRITE_GITHUB_OUTPUT: 'true'
        run: |
          set -euo pipefail
          target="ProcessMaker/${ENTRY_REPO}"
          branch=$(jq -r --arg r "$ENTRY_REPO" '.[$r] // empty' <<<"$BRANCH_MAP")
          if [ -z "$branch" ] || ! gh api "repos/${target}/branches/${branch}" >/dev/null 2>&1; then
            branch=$(gh api "repos/${target}" --jq .default_branch)
          fi
          TARGET_REPO="$target" \
            BRANCH="$branch" \
            ORIGIN_BRANCH="$branch" \
            bash _pm_github/.github/scripts/dispatch-js-package.sh

  pack:
    name: Pack tarball
    needs: [resolve-stack, upstream-bootstrap]
    if: |
      always() &&
      (needs.resolve-stack.result == 'success' || needs.resolve-stack.result == 'skipped') &&
      (needs.upstream-bootstrap.result == 'success' || needs.upstream-bootstrap.result == 'skipped') &&
      ((github.event_name == 'pull_request' && github.event.action != 'closed') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      has-js-downstream: ${{ steps.meta.outputs.has-js-downstream }}
      has-processmaker: ${{ steps.meta.outputs.has-processmaker }}
      js-repos: ${{ steps.meta.outputs.js-repos }}
      package-name: ${{ steps.meta.outputs.package-name }}
      version: ${{ steps.meta.outputs.version }}
      stack-id: ${{ steps.ids.outputs.stack-id }}
    steps:
      - name: Resolve stack id
        id: ids
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.stack_id }}" ]; then
            sid="${{ inputs.stack_id }}"
          elif [ -n "${{ needs.resolve-stack.outputs.stack-id }}" ]; then
            sid="${{ needs.resolve-stack.outputs.stack-id }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            sid="${{ github.event.repository.name }}-pr-${{ github.event.pull_request.number }}"
          else
            sid="${{ github.event.repository.name }}-${{ github.run_id }}"
          fi
          echo "stack-id=$sid" >> "$GITHUB_OUTPUT"
          echo "Stack id: $sid"

      - name: Resolve checkout ref
        id: ref
        env:
          BRANCH_MAP: ${{ needs.resolve-stack.outputs.branch_map || inputs.branch_map }}
          TRIGGER_REPO: ${{ needs.resolve-stack.outputs.trigger_repo || inputs.trigger_repo }}
          TRIGGER_HEAD_REF: ${{ needs.resolve-stack.outputs.trigger_head_ref || inputs.trigger_head_ref }}
          ORIGIN_BRANCH: ${{ inputs.origin_branch }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch=""
          if [ -n "$TRIGGER_REPO" ] && [ "$repo_name" = "$TRIGGER_REPO" ] && [ -n "$TRIGGER_HEAD_REF" ]; then
            branch="$TRIGGER_HEAD_REF"
          elif [ -n "$BRANCH_MAP" ]; then
            branch=$(jq -r --arg r "$repo_name" '.[$r] // empty' <<<"$BRANCH_MAP")
          fi
          if [ -z "$branch" ]; then
            branch="$ORIGIN_BRANCH"
          fi
          if [ -z "$branch" ]; then
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Download upstream stack
        if: ${{ (needs.upstream-bootstrap.outputs.run-id || inputs.source_run_id) != '' }}
        uses: ProcessMaker/.github/.github/actions/js-download-stack@main
        with:
          source-repo: ${{ needs.upstream-bootstrap.outputs.repo || inputs.source_repo }}
          source-run-id: ${{ needs.upstream-bootstrap.outputs.run-id || inputs.source_run_id }}
          dest: js-stack

      - uses: ProcessMaker/.github/.github/actions/js-pack@main
        with:
          stack-dir: js-stack
          stack-id: ${{ steps.ids.outputs.stack-id }}
          origin-repo: ${{ github.event_name == 'workflow_dispatch' && inputs.source_repo || github.repository }}
          origin-pr: ${{ github.event.pull_request.number }}
          origin-sha: ${{ github.sha }}

      - uses: ProcessMaker/.github/.github/actions/js-next-downstream@main
        id: meta

      - uses: actions/upload-artifact@v4
        with:
          name: js-stack
          path: js-stack/
          if-no-files-found: error

  cascade-pr:
    name: Cascade PR rebuild
    needs: [pack, resolve-stack]
    if: |
      always() &&
      needs.pack.result == 'success' &&
      (needs.resolve-stack.result == 'success' || needs.resolve-stack.result == 'skipped') &&
      needs.pack.outputs.has-js-downstream == 'true'
    runs-on: ubuntu-latest
    outputs:
      final-repo: ${{ steps.cascade.outputs.final-repo }}
      final-run-id: ${{ steps.cascade.outputs.final-run-id }}
      did-cascade: ${{ steps.cascade.outputs.did-cascade }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ProcessMaker/.github
          path: _pm_github

      - id: cascade
        env:
          JS_REPOS: ${{ needs.pack.outputs.js-repos }}
          STACK_ID: ${{ needs.pack.outputs.stack-id }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          ORIGIN_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || inputs.origin_branch }}
          BRANCH_MAP: ${{ needs.resolve-stack.outputs.branch_map || inputs.branch_map }}
          STOP_BEFORE: ${{ needs.resolve-stack.outputs.stop_before || inputs.cascade_stop_before }}
          CASCADE_STOP_BEFORE: ${{ needs.resolve-stack.outputs.stop_before || inputs.cascade_stop_before }}
          TRIGGER_REPO: ${{ needs.resolve-stack.outputs.trigger_repo || inputs.trigger_repo }}
          TRIGGER_HEAD_REF: ${{ needs.resolve-stack.outputs.trigger_head_ref || inputs.trigger_head_ref }}
        run: |
          set -euo pipefail
          source_repo="$SOURCE_REPO"
          source_run_id="$SOURCE_RUN_ID"
          final_repo="$source_repo"
          final_run_id="$source_run_id"
          did_cascade=false

          mapfile -t repos < <(jq -r '.[]' <<<"$JS_REPOS")
          for repo in "${repos[@]}"; do
            if [ -n "$STOP_BEFORE" ] && [ "$repo" = "$STOP_BEFORE" ]; then
              echo "Stopping cascade before ${repo}"
              break
            fi
            target="ProcessMaker/${repo}"
            branch="$ORIGIN_BRANCH"
            if [ -n "$BRANCH_MAP" ]; then
              mapped=$(jq -r --arg r "$repo" '.[$r] // empty' <<<"$BRANCH_MAP")
              if [ -n "$mapped" ]; then
                branch="$mapped"
              fi
            fi
            if [ -z "$branch" ] || ! gh api "repos/${target}/branches/${branch}" >/dev/null 2>&1; then
              branch=$(gh api "repos/${target}" --jq .default_branch)
            fi
            TARGET_REPO="$target" \
              BRANCH="$branch" \
              ORIGIN_BRANCH="$branch" \
              SOURCE_REPO="$source_repo" \
              SOURCE_RUN_ID="$source_run_id" \
              bash _pm_github/.github/scripts/dispatch-js-package.sh
            source_repo=$(cat /tmp/js-dispatch-repo)
            source_run_id=$(cat /tmp/js-dispatch-run-id)
            final_repo="$source_repo"
            final_run_id="$source_run_id"
            did_cascade=true
          done

          echo "final-repo=$final_repo" >> "$GITHUB_OUTPUT"
          echo "final-run-id=$final_run_id" >> "$GITHUB_OUTPUT"
          echo "did-cascade=$did_cascade" >> "$GITHUB_OUTPUT"

  merge-stack:
    name: Merge complete JS stack
    needs: [pack, cascade-pr]
    if: always() && needs.pack.result == 'success' && (needs.cascade-pr.result == 'success' || needs.cascade-pr.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Download complete stack from downstream
        if: needs.cascade-pr.result == 'success' && needs.cascade-pr.outputs.did-cascade == 'true'
        uses: ProcessMaker/.github/.github/actions/js-download-stack@main
        with:
          source-repo: ${{ needs.cascade-pr.outputs.final-repo }}
          source-run-id: ${{ needs.cascade-pr.outputs.final-run-id }}
          dest: js-stack

      - name: Download this run's stack
        if: needs.cascade-pr.result != 'success' || needs.cascade-pr.outputs.did-cascade != 'true'
        uses: actions/download-artifact@v4
        with:
          name: js-stack
          path: js-stack

      - uses: actions/upload-artifact@v4
        with:
          name: js-stack
          path: js-stack/
          overwrite: true

  deploy:
    name: Deploy CICD image
    needs: [pack, cascade-pr, merge-stack]
    if: |
      always() &&
      needs.pack.result == 'success' &&
      (needs.cascade-pr.result == 'success' || needs.cascade-pr.result == 'skipped') &&
      needs.merge-stack.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    uses: processmaker/.github/.github/workflows/deploy-pm4.yml@main
    with:
      js_source_repo: ${{ github.repository }}
      js_source_run_id: ${{ github.run_id }}
      cicd_operation: deploy
    secrets: inherit

  deploy-closed:
    name: Delete CICD instance
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    uses: processmaker/.github/.github/workflows/deploy-pm4.yml@main
    with:
      cicd_operation: delete
    secrets: inherit

  publish:
    name: Publish to npmjs
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.pub.outputs.published }}
      version: ${{ steps.pub.outputs.version }}
      package-name: ${{ steps.pub.outputs.package-name }}
      has-js-downstream: ${{ steps.meta.outputs.has-js-downstream }}
      has-processmaker: ${{ steps.meta.outputs.has-processmaker }}
      js-repos: ${{ steps.meta.outputs.js-repos }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: ProcessMaker/.github/.github/actions/js-next-downstream@main
        id: meta

      - uses: ProcessMaker/.github/.github/actions/js-npm-publish@main
        id: pub
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

  cascade-release:
    name: Cascade GitHub Release
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.published == 'true' && needs.publish.outputs.has-js-downstream == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config --global user.name '${{ secrets.GH_USER }}'
          git config --global user.email '${{ secrets.GH_EMAIL }}'

      - name: Release downstream JS packages
        env:
          JS_REPOS: ${{ needs.publish.outputs.js-repos }}
          UPSTREAM_NPM: ${{ needs.publish.outputs.package-name }}
          UPSTREAM_VERSION: ${{ needs.publish.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.release.target_commitish || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mapfile -t repos < <(jq -r '.[]' <<<"$JS_REPOS")
          for repo in "${repos[@]}"; do
            target="ProcessMaker/${repo}"
            rm -rf /tmp/ds
            git clone --depth 50 "https://x-access-token:${GH_TOKEN}@github.com/${target}.git" /tmp/ds
            cd /tmp/ds
            branch="$DEFAULT_BRANCH"
            if git fetch origin "$branch" && git checkout -B "$branch" "origin/${branch}"; then
              true
            else
              branch=$(gh api "repos/${target}" --jq .default_branch)
              git fetch origin "$branch"
              git checkout -B "$branch" "origin/${branch}"
            fi

            current=$(jq -r --arg n "$UPSTREAM_NPM" '
              .dependencies[$n] // .devDependencies[$n] // .optionalDependencies[$n] // empty
            ' package.json)
            stripped=$(echo "$current" | sed 's/^[^0-9]*//')
            if [ "$stripped" = "$UPSTREAM_VERSION" ]; then
              echo "${target} already depends on ${UPSTREAM_NPM}@${UPSTREAM_VERSION}; skipping"
              cd /
              rm -rf /tmp/ds
              continue
            fi

            npm install --save-exact "${UPSTREAM_NPM}@${UPSTREAM_VERSION}"
            git add package.json package-lock.json
            git commit -m "chore: bump ${UPSTREAM_NPM} to ${UPSTREAM_VERSION}"
            npm version patch -m "chore: release %s"
            git push origin HEAD
            git push origin --tags
            new_tag=$(git describe --tags --abbrev=0)
            gh release create "$new_tag" --repo "$target" --target "$branch" \
              --title "$new_tag" \
              --notes "Automated cascade from ${UPSTREAM_NPM}@${UPSTREAM_VERSION}"
            cd /
            rm -rf /tmp/ds
          done

  processmaker-pr:
    name: Open processmaker JS bump PR
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.published == 'true' && needs.publish.outputs.has-processmaker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          path: released

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config --global user.name '${{ secrets.GH_USER }}'
          git config --global user.email '${{ secrets.GH_EMAIL }}'

      - name: Open PR on processmaker
        env:
          UPSTREAM_NPM: ${{ needs.publish.outputs.package-name }}
          UPSTREAM_VERSION: ${{ needs.publish.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.release.target_commitish || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pm
          git clone --depth 20 "https://x-access-token:${GH_TOKEN}@github.com/ProcessMaker/processmaker.git" /tmp/pm
          cd /tmp/pm
          branch="$DEFAULT_BRANCH"
          if git fetch origin "$branch" && git checkout -B "$branch" "origin/${branch}"; then
            true
          else
            branch=$(gh api repos/ProcessMaker/processmaker --jq .default_branch)
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/${branch}"
          fi

          specs=("${UPSTREAM_NPM}@${UPSTREAM_VERSION}")
          while IFS= read -r line; do
            name=$(echo "$line" | awk '{print $1}')
            ver=$(echo "$line" | awk '{print $2}')
            in_pm=$(jq -r --arg n "$name" '.dependencies[$n] // empty' package.json)
            if [ -n "$in_pm" ] && [ "$name" != "$UPSTREAM_NPM" ]; then
              specs+=("${name}@${ver}")
            fi
          done < <(jq -r '.dependencies // {} | to_entries[] | select(.key | startswith("@processmaker/")) | "\(.key) \(.value)"' "$GITHUB_WORKSPACE/released/package.json")

          git checkout -b "chore/js-${UPSTREAM_VERSION}"
          npm install --save-exact "${specs[@]}"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No processmaker JS dependency changes"
            exit 0
          fi
          git commit -m "chore: bump JS packages for ${UPSTREAM_NPM}@${UPSTREAM_VERSION}"
          git push -u origin HEAD
          gh pr create --repo ProcessMaker/processmaker \
            --base "$branch" \
            --title "chore: bump JS packages (${UPSTREAM_NPM}@${UPSTREAM_VERSION})" \
            --body "Automated follow-up to the ${UPSTREAM_NPM}@${UPSTREAM_VERSION} release."
